<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://vevsurxxvjivjizuuqad.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Designaciones · Vòlei EnXarxa</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="../designa.css">
<style>
.board .acts{position:absolute;top:0;right:0;display:flex;gap:8px;align-items:center}
.board .acts .lang{position:static}
.board .salir{color:#fff;border-color:#fff;min-height:32px;padding:0 10px;font-size:14px}
#login{max-width:380px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px}
.kpis div{font-size:13.5px;color:var(--ink-2)} .kpis b{display:block;font:700 24px/1 var(--display);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.bar .opts label{min-height:38px;padding:2px 12px}
.bar input[type=search]{width:auto;flex:1;min-width:180px;margin:0}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-height:38px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin:0 0 12px}
.tabs button{border:0;border-bottom:4px solid transparent;border-radius:0;margin-bottom:-2px;padding:0 14px;font-family:var(--display);font-size:19px;font-weight:600}
.tabs button[aria-selected="true"]{border-bottom-color:var(--yellow)}
.dia-h{font-family:var(--display);font-size:22px;margin:18px 0 8px}
.m{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--surface)}
.m.ok{border-left:5px solid var(--ok)} .m.falta{border-left:5px solid var(--yellow)} .m.mal{border-left-color:var(--warn)}
.choque{margin:6px 0 0;font-size:13.5px;font-weight:600} .choque.pisa{color:var(--warn)} .choque.justo{color:var(--ink-2)}
.m .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.m .hora{font:700 20px/1 var(--display)}
.m .eq{font-weight:700}
.m .pab{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.slots label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.slots select{margin-top:2px;min-height:40px;padding:6px 8px;font-size:14px}
.slots .s-mas{display:none}
.recs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.recs .l{font-size:12.5px;color:var(--ink-3);font-weight:600}
.recs button{min-height:34px;padding:0 10px;border-width:1px;border-radius:17px;font-size:13.5px;font-weight:600}
.recs button small{font-weight:400;color:var(--ink-2)}
.a{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.a .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.a .n{font-weight:700;font-size:16px}
.a .d{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.a .acts{margin-top:8px}
.a .acts button{min-height:34px;font-size:13.5px;padding:0 10px}
#alta{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:10}
#alta form{max-width:520px;width:100%}
#aviso{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:11}
#aviso .card{max-width:460px;width:100%}
#avTxt{white-space:pre-line}
/* Lo visual (vistas.js, 4-nov-2026) */
:root{--y-bg:#FFF4C2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--y-bg:#2E2600} }
:root[data-theme="dark"]{--y-bg:#2E2600}
.seg label{min-height:38px;padding:2px 14px}
.kpis{gap:12px 28px;align-items:flex-end}
.prog{flex:1 1 220px;min-width:180px;max-width:340px}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--ink-2)}
.prog .pt b{font:700 20px/1.1 var(--display);color:var(--ink)}
.pbar{display:block;height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--yellow);transition:width .4s}
.pbar.full i{background:var(--ok)} .pbar.hecho i{background:var(--ink-2)}
.kmini{flex-basis:100%;font-size:13.5px;color:var(--ink-2)}
.ini{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:var(--c);color:#fff;font:700 11.5px/1 Barlow,system-ui,sans-serif;margin-right:5px;flex:none;vertical-align:middle}
.slots label .ini{min-width:20px;height:20px;font-size:10.5px}
.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.lay:has(#lado.hidden){grid-template-columns:minmax(0,1fr)}
#lado{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
#lado h2{font:700 21px/1.1 var(--display);margin:0 0 2px} #lado p{margin:0 0 6px} #lado ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.arb-l{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"c n" "c g" "f f";gap:0 4px;width:100%;text-align:left;min-height:0;padding:6px;border:1px solid transparent;border-radius:6px;font-weight:600;justify-content:stretch;align-items:center}
.arb-l:hover{background:var(--surface-2)}
.arb-l .ini{grid-area:c;grid-row:1/3} .arb-l .nm{grid-area:n;font-size:14px;line-height:1.2} .arb-l .cg{grid-area:g;font-size:12.5px;color:var(--ink-2);font-weight:400;line-height:1.2}
.arb-l .fr{grid-area:f;display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.arb-l[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.fr i{font-style:normal;font-size:11px;font-weight:700;padding:1px 5px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2)}
.fr i.libre{border-color:var(--ok);color:var(--ok)} .fr i.ocup{background:var(--ok);border-color:var(--ok);color:var(--bg)} .fr i.no{color:var(--ink-3);text-decoration:line-through}
.mini{min-height:30px;padding:0 8px;font-size:12.5px;border-width:1px;align-self:flex-start}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin:0 0 8px;align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid;border-left-width:4px}
.sw.ok{background:var(--ok-bg);border-color:var(--ok)} .sw.falta{background:var(--y-bg);border-color:var(--yellow)} .sw.mal{background:var(--warn-bg);border-color:var(--warn)}
.sw.isq{background:var(--surface-2);border-color:var(--ink-3)} .sw.prop{border-style:dashed;border-color:var(--ink)}
.rej-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:0 0 18px;background:var(--surface)}
.rej{--alto:62px;--pabw:170px;min-width:calc(var(--pabw) + var(--w) + 12px)}
.rej-cab,.rej-fila{display:grid;grid-template-columns:var(--pabw) calc(var(--w) + 12px)}
.rej-cab{border-bottom:2px solid var(--line)}
.rej-horas{position:relative;height:26px}
.rej-horas span{position:absolute;top:5px;padding-left:3px;font-size:12px;font-weight:600;color:var(--ink-3)}
.rej-fila{border-bottom:1px solid var(--line)} .rej-fila:last-child{border-bottom:0}
.rej-pab{position:sticky;left:0;background:var(--surface);z-index:1;padding:6px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.rej-pab b{line-height:1.15;overflow-wrap:anywhere} .rej-pab small{color:var(--ink-2)}
.rej-pista{position:relative;height:calc(var(--n) * var(--alto) + 4px);background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--hora))}
.blq{position:absolute;margin:3px 0 0 2px;width:calc(var(--dur) - 4px);height:calc(var(--alto) - 4px);min-height:0;padding:3px 6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;border-radius:6px;border:1px solid var(--line);border-left-width:5px;font-weight:600;font-size:12px;line-height:1.15;text-align:left;overflow:hidden;background:var(--surface);color:var(--ink)}
.blq:hover{filter:brightness(.96);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.blq .bh{font:700 15px/1 var(--display)} .blq .bc{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blq .bq{display:flex;gap:2px;margin-top:auto} .blq .ini{min-width:20px;height:20px;font-size:10.5px;margin:0}
.blq .vacio{font-size:11px;color:var(--ink-3);font-weight:600}
.blq.ok{background:var(--ok-bg);border-color:var(--ok)} .blq.falta{background:var(--y-bg);border-color:var(--yellow)} .blq.mal{background:var(--warn-bg);border-color:var(--warn)} .blq.isq{background:var(--surface-2);border-color:var(--ink-3)}
.blq.prop,.m.prop{border-style:dashed;border-color:var(--ink)} .blq.prop{border-left-style:solid}
.resalta .blq:not(.suyo),.resalta article.m:not(.suyo){opacity:.28}
.prop-b{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--y-bg);color:var(--ink);border:2px dashed var(--ink)}
.prop-b button{min-height:38px}
.mapa{width:100%;height:auto;max-height:78vh;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 12px}
.mapa .prov{fill:var(--surface-2);stroke:var(--ink-3);stroke-linejoin:round}
.mapa .ciu{fill:var(--ink-3);font-weight:600;font-family:Barlow,system-ui,sans-serif} .mapa .ciu-p{fill:var(--ink-3)}
.mapa line{opacity:.8;stroke-linecap:round}
.mapa .pb{stroke:var(--bg);cursor:pointer} .pb.ok{fill:var(--ok)} .pb.falta{fill:var(--yellow);stroke:#000} .pb.mal{fill:var(--warn)} .pb.isq{fill:var(--ink-3)}
.mapa .pb.sel{stroke:var(--ink);stroke-width:4px} .mapa .pb:focus-visible{outline:none;stroke:var(--focus);stroke-width:4px}
.mapa .arb-m{pointer-events:none}   /* el cuadrado del árbitro no tapa el pabellón de su pueblo al tocarlo */
.mapa .arb-m text{fill:#fff;font-weight:700;font-family:Barlow,system-ui,sans-serif}
.mapa .tenue{opacity:.12}
.capa{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:10}
.capa .card{max-width:560px;width:100%} #ficha article.m{border:0;padding:0;margin:0;background:none} #ficha .cab{justify-content:flex-end;margin:-6px -8px 0 0}
#frLista{margin:0 0 14px;padding-left:20px}
.chk.hecho{margin-top:6px;font-size:13.5px;min-height:32px}
/* Por pabellón (vistas.js, pabellonesHtml) */
details.pab{border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:8px;margin:0 0 8px;background:var(--surface)}
details.pab.ok{border-left-color:var(--ok)} details.pab.mal{border-left-color:var(--warn)}
details.pab summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:10px 12px;cursor:pointer;list-style:none}
details.pab summary::-webkit-details-marker{display:none}
details.pab summary::before{content:"▸";font-size:14px;color:var(--ink-2);transition:transform .15s} details.pab[open] summary::before{transform:rotate(90deg)}
details.pab .pn{display:flex;flex-direction:column;min-width:180px;flex:1} details.pab .pn small{color:var(--ink-2)}
details.pab .pc{font-size:13.5px;color:var(--ink-2)} details.pab .pc b{color:var(--ink)}
details.pab .pts{display:flex;gap:3px;flex-wrap:wrap;max-width:240px}
.pdot{width:12px;height:12px;border-radius:3px;border:1px solid;display:inline-block}
.pdot.ok{background:var(--ok);border-color:var(--ok)} .pdot.falta{background:var(--yellow);border-color:#000} .pdot.mal{background:var(--warn);border-color:var(--warn)} .pdot.isq{background:var(--ink-3);border-color:var(--ink-3)}
.pab-in{padding:0 12px 12px}
.blo{border-top:1px solid var(--line);padding:8px 0 4px}
.blo h3{font:700 18px/1.2 var(--display);margin:0 0 4px} .blo h3 small{font:400 13px Barlow,system-ui,sans-serif;color:var(--ink-2)}
.ok-t{color:var(--ok);font-weight:700;margin:0 0 4px}
article.m.fila{display:grid;grid-template-columns:52px minmax(150px,1.4fr) repeat(3,minmax(110px,1fr)) auto;gap:6px 8px;align-items:center;padding:6px 8px;margin:4px 0;border-left-width:4px}
article.m.fila.ok{background:var(--ok-bg)} article.m.fila.falta{background:var(--y-bg)} article.m.fila.mal{background:var(--warn-bg);border-color:var(--warn)} article.m.fila.isq{background:var(--surface-2)}
.fila .fh{font:700 17px/1 var(--display)} .fila .fe{display:flex;flex-direction:column;min-width:0;font-size:13.5px} .fila .fe small{color:var(--ink-2)}
.fila .fs{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
.fila .fs .fr-l{display:none}
.fila select{margin:0;min-height:36px;padding:4px 6px;font-size:13.5px;min-width:0}
.fila .fk{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer} .fila .fk input{width:18px;height:18px;accent-color:var(--ink)}
@media (max-width:760px){
  article.m.fila{grid-template-columns:44px 1fr auto} .fila .fs{grid-column:1/-1} .fila .fs .fr-l{display:inline;min-width:64px}
  .fila .fk{grid-column:3;grid-row:1}
}
/* Importar (importar.js) y tutorial (tutorial.js) */
.capa .card.ancha{max-width:920px}
.imp-scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:6px;margin:0 0 12px}
.imp-t{border-collapse:collapse;width:100%;font-size:13.5px}
.imp-t th,.imp-t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.imp-t th{position:sticky;top:0;background:var(--surface-2);font-weight:700}
.imp-t tr.error td{background:var(--warn-bg)} .imp-t .tag{white-space:normal}
#ayuda{text-decoration:none}
#ayuda span[aria-hidden]{display:inline-flex;width:22px;height:22px;border-radius:11px;background:var(--yellow);color:#000;align-items:center;justify-content:center;font-weight:800}
#tour{position:fixed;z-index:20;width:min(380px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#tour.centro{top:50%!important;left:50%!important;transform:translate(-50%,-50%)}
#tour h2{font:700 22px/1.1 var(--display);margin:0 0 6px} #tour p{margin:0 0 10px} #tour #tourN{margin:0 0 2px}
#tour button{min-height:38px}
#tourHueco{position:fixed;z-index:19;pointer-events:none;border:4px solid var(--yellow);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
@media (max-width:900px){
  .lay{display:block} #lado{position:static;max-height:none;margin:0 0 12px}
  #lado ul{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px} #lado li{flex:none;width:190px}
  .rej{--pabw:118px}
}
@media (max-width:600px){
  .slots{grid-template-columns:1fr}
  .slots:not(.mas) :is(.s-r2,.s-an){display:none}
  .slots:not(.mas) .s-mas{display:inline-flex;justify-self:start;min-height:36px;padding:0;font-size:13.5px}
  .board .acts{position:static;margin-top:8px}
  .bar input[type=search]{flex-basis:100%}
}
</style>
</head>
<body>
<header class="board"><div class="in">
  <div class="acts"><button type="button" class="salir hidden" id="salir" data-t="salir">Salir</button><div class="lang" role="group" aria-label="Idioma"><button type="button" data-set="es">ES</button><button type="button" data-set="ca">CA</button></div></div>
  <h1 data-t="titulo">Designaciones</h1>
  <p class="sub" id="sub" data-t="subLogin">Fin de semana · FCVB</p>
</div></header>

<main id="login">
  <form class="card" id="fLogin" novalidate>
    <h2 data-t="entrar">Entrar</h2>
    <div id="lmsg" role="status" aria-live="polite"></div>
    <label class="f"><span data-t="usuario">Usuario</span><input type="text" id="usuario" autocomplete="username" autocapitalize="none" required></label>
    <label class="f"><span data-t="clave">Contraseña</span><input type="password" id="clave" autocomplete="current-password" required></label>
    <button type="submit" class="primary" id="bLogin" data-t="entrar">Entrar</button>
  </form>
</main>

<main class="wide hidden" id="app">
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="bar">
    <div class="opts" id="findes" role="radiogroup" aria-label="Fin de semana"></div>
    <button type="button" id="actualizar" data-t="actualizar">Actualizar</button>
    <button type="button" id="exportar" data-t="exportar">Exportar a Excel</button>
    <button type="button" id="copiar" data-t="copiarEnlace">Copiar enlace del formulario</button>
    <button type="button" class="ghost" id="ayuda"><span aria-hidden="true">?</span> <span data-t="ayuda">Cómo funciona</span></button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" role="tablist"><button type="button" role="tab" id="tPart" aria-selected="true" data-t="partidos">Partidos</button><button type="button" role="tab" id="tArb" aria-selected="false">Árbitros</button></div>
  <section id="vPart">
    <div class="bar">
      <div class="opts" role="radiogroup" aria-label="Día" id="dias"></div>
      <label class="chk"><input type="checkbox" id="soloLiga" checked> <span data-t="soloLiga">Solo liga (sin alevín, máster ni amateur)</span></label>
      <label class="chk hidden" id="lSinIsq"><input type="checkbox" id="soloSinIsq"> <span data-t="soloSinIsq">Solo sin árbitro en iSquad</span></label>
      <label class="chk"><input type="checkbox" id="soloPend"> <span data-t="soloPend">Solo sin R1 en el plan</span></label>
      <input type="search" id="buscar" data-tp="buscar" placeholder="Buscar equipo, pabellón o categoría" aria-label="Buscar">
    </div>
    <div class="bar">
      <div class="opts seg" role="radiogroup" aria-label="Vista" id="vistas"></div>
      <button type="button" class="primary" id="proponer" data-t="proponer">Proponer reparto</button>
    </div>
    <div id="prop"></div>
    <p class="small muted hidden" id="ubicando"></p>
    <div class="lay"><aside id="lado" aria-labelledby="ladoT"></aside><div id="lista"></div></div>
  </section>
  <section id="vArb" class="hidden">
    <div class="bar" id="impBar">
      <button type="button" class="primary" id="nuevo" data-t="nuevo">Añadir árbitro</button>
      <button type="button" id="bImp" data-t="iBoton">Importar Excel</button>
      <button type="button" class="ghost" id="bPlantilla" data-t="iPlantilla">Descargar plantilla</button>
      <button type="button" class="ghost" id="bExpDisp" data-t="iExportar">Exportar disponibilidad</button>
      <input type="file" id="impFile" class="hidden" accept=".xlsx,.xls,.ods,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
      <span class="small muted" data-t="nuevoH">Para quien te la ha mandado por correo (o por otra vía).</span>
    </div>
    <div id="arbs"></div>
  </section>
</main>

<div id="alta" class="hidden" role="dialog" aria-modal="true" aria-labelledby="hAlta">
  <form class="card" id="fAlta" novalidate>
    <h2 id="hAlta" data-t="nuevo">Añadir árbitro</h2>
    <div id="amsg" role="status" aria-live="polite"></div>

let LANG='es'; try{ LANG = localStorage.getItem('liq-lang') || ((navigator.language||'').toLowerCase().startsWith('ca')?'ca':'es'); }catch(e){}
const t = k => T[LANG][k] ?? T.es[k];
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FN = window.APP_CONFIG.SUPABASE_URL + '/functions/v1/designa';
let TOKEN = ''; try{ const x = JSON.parse(localStorage.getItem('designa-sesion')||'null'); if(x && x.exp > Date.now()) TOKEN = x.token; }catch(e){}
async function api(body){
  let r; try{ r = await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.APP_CONFIG.SUPABASE_ANON_KEY,...(TOKEN?{'x-designa-token':TOKEN}:{})},body:JSON.stringify(body)}); }
  catch(e){ return {ok:false,error:t('red')}; }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(r.status===401 && body.action!=='login'){ salir(t('caducada')); }
  return {...j, ok:r.ok && j.ok!==false};
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(e=>{ const v=t(e.dataset.t); if(typeof v==='string') e.textContent=v; });
  document.querySelectorAll('[data-tp]').forEach(e=>{ e.placeholder=t(e.dataset.tp); e.setAttribute('aria-label', t(e.dataset.tp)); });
  document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.set===LANG)));
  for(const [id,n] of [['aSab','aSab'],['aDom','aDom']]) $(id).innerHTML = ['manana','tarde','ambas','no'].map(v=>`<label><input type="radio" name="${n}" value="${v}"><span>${esc(v==='no'?t('noPuede'):t(v))}</span></label>`).join('');
  if(D) pintar();
}
document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.set; try{localStorage.setItem('liq-lang',LANG);}catch(e){} applyLang(); }));

/* ---------- Login ---------- */
function salir(aviso){
  TOKEN=''; try{ localStorage.removeItem('designa-sesion'); }catch(e){}
  D=null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('salir').classList.add('hidden');
  $('sub').textContent = t('subLogin'); $('lmsg').innerHTML = aviso ? `<p class="msg err">${esc(aviso)}</p>` : '';
}
$('salir').addEventListener('click', ()=>salir());

function msg(text, kind){ $('msg').innerHTML = text ? `<p class="msg ${kind}">${esc(text)}</p>` : ''; }
const fecha = (d, n, o={day:'numeric',month:'long'}) => new Intl.DateTimeFormat(LANG==='ca'?'ca-ES':'es-ES',{...o,timeZone:'UTC'}).format(new Date(Date.parse(d+'T12:00:00Z')+n*864e5));
const dia = m => m.d.slice(0,10)===FINDE ? 'sab' : 'dom';

// Distancia aproximada por carretera: línea recta × 1,25 (sin gastar rutas; solo para ordenar y orientar).
function km(a, m){
  if(a.lat==null || m.lat==null) return null;
  const R=6371, r=x=>x*Math.PI/180, dLa=r(m.lat-a.lat), dLo=r(m.lon-a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(m.lat))*Math.sin(dLo/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h))*1.25);

// Desde dónde sale (4-nov-2026, Ferran: "si me designan en Terrassa, el siguiente no se cuenta desde Capellades"): si ese
// día ya tiene otro partido (en el plan o en iSquad) que empieza a menos de 4 h de este, desde ese pabellón; si hay más
// rato, vuelve a casa. Se toma el más cercano en hora, antes o después (ir de A a B o de B a A son los mismos km).
const VUELVE_CASA = 240;
function origen(a, m, plan){
  let mejor=null;
  for(const o of ocupaciones(a, plan)){
    if(o.d.slice(0,10)!==m.d.slice(0,10) || (o.m && o.m.key===m.key)) continue;
    const gap=Math.abs(mins(o)-mins(m)); if(gap>=VUELVE_CASA) continue;
    if(!mejor || gap<mejor.gap) mejor={o, gap};
  }
  return mejor && mejor.o.m && mejor.o.m.lat!=null ? mejor.o : null;   // sin ubicar ese pabellón: desde casa
}
function kmAct(a, m, plan){ const o=origen(a, m, plan); return o ? {k:km({lat:o.m.lat, lon:o.m.lon}, m), desde:o} : {k:km(a, m), desde:null}; }
// "≈ 12 km · desde Terrassa" / "≈ 0 km · sigue en el pabellón" / "≈ 30 km"
function kmTxt(k, desde, m){

}
// Plan guardado + la propuesta automática que se está revisando (PROP, en vistas.js), sin pisar lo guardado.
const PLAN = () => { const p={}; for(const x of D.asig) (p[x.match_key] ||= {})[x.rol]=x.disp_id; for(const x of PROP||[]) { const q=(p[x.key] ||= {}); if(!q[x.rol]) q[x.rol]=x.disp_id; } return p; };
const HECHO = () => new Set(D.hecho||[]);

// servidor (supabase/functions/designa, choqueDe):
// - 'pisa': inicios a menos de 1 h en el mismo pabellón, o de 1 h 45 min en otro → al elegirlo sale un aviso y el
//   designador decide (4-nov-2026, Ferran: aviso, no bloqueo); el servidor solo lo guarda si se ha confirmado (forzar).
// - 'justo': otro pabellón sin margen para el viaje (1 h 45 min + ≈1 min por km + 15 min; sin distancia, 2 h 30 min) → solo aviso.
// Cuenta su plan en este panel y, si tiene cuenta en la app, lo que ya tiene designado en iSquad (a.isq).
const PISA=105, PISA_MISMO=60;
const sinPista = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s*-\s*(PISTA|TERCIO|TERC|CAMP|SALA|ANNEX).*$/,'').replace(/\s+/g,' ').trim();

function ocupaciones(a, plan){
  const out=[];
  for(const x of D.partidos){ const p=plan[x.key]; if(p && Object.values(p).includes(a.id)) out.push({m:x, d:x.d, pab:x.pab, plan:true}); }
  for(const o of a.isq||[]){
    const x = D.partidos.find(m=>m.d===o.d && mismoPab(m.pab,o.pab));
    out.push({m:x||null, d:o.d, pab:x?.pab||o.pab, isq:true});
  }
  return out;
}
function choque(a, m, plan){
  let justo=null;
  for(const o of ocupaciones(a, plan)){
    if(o.d.slice(0,10)!==m.d.slice(0,10)) continue;
    if(o.m && o.m.key===m.key) { if(o.isq) continue; if(o.plan) return {tipo:'pisa', o, aqui:true}; }
    const gap=Math.abs(mins(o)-mins(m)), mismo=mismoPab(o.pab, m.pab);

// Aviso de choque: devuelve true si el designador lo pone igualmente.
function confirmarChoque(texto){
  return new Promise(ok=>{
    const box=$('aviso'), fin=v=>{ box.classList.add('hidden'); box.onkeydown=null; $('avSi').onclick=$('avNo').onclick=null; ok(v); };
    $('avTxt').textContent=texto; box.classList.remove('hidden');
    $('avSi').onclick=()=>fin(true); $('avNo').onclick=()=>fin(false); box.onkeydown=e=>{ if(e.key==='Escape') fin(false); };
    $('avNo').focus();
  });
}
async function asignar(key, rol, id){
  // ¿Choca con otro partido suyo? El mismo partido en 2 puestos no se deja; lo demás, aviso y decide el designador.
  let forzar=false;
  if(id){ const a=ARB()[id], m=D.partidos.find(x=>x.key===key), plan=PLAN(); if(plan[key]) plan[key]={...plan[key]}, delete plan[key][rol];
    const ch = a && m && choque(a, m, plan);
    if(ch?.aqui){ msg(t('yaAqui')(corto(a.nombre)),'err'); pintar(); return; }
    if(ch?.tipo==='pisa'){ if(!(await confirmarChoque(t('avPisa')(corto(a.nombre), ocTxt(ch.o))))){ pintar(); return; } forzar=true; } }
  // Al momento en pantalla; si el servidor falla, se recarga lo guardado.
  D.asig = D.asig.filter(x=>!(x.match_key===key && x.rol===rol)); if(id) D.asig.push({match_key:key, rol, disp_id:id});
  pintar();
  const r = await api({action:'asignar', finde:FINDE, key, rol, disp_id:id||null, forzar});
  if(!r.ok){ msg(r.error||t('red'),'err'); cargar(); }
}

    const r=await api({action:'quitar', finde:FINDE, id:a.id}); if(!r.ok){ msg(r.error||t('red'),'err'); } cargar(); }
});
$('findes').addEventListener('change', e=>{ if(e.target.name==='finde'){ FINDE=e.target.value; D=null; cargar(FINDE); } });
$('dias').addEventListener('change', e=>{ if(e.target.name==='dia'){ DIA=e.target.value; pintar(); } });
for(const id of ['soloLiga','soloSinIsq','soloPend']) $(id).addEventListener('change', pintar);
$('buscar').addEventListener('input', ()=>{ clearTimeout($('buscar')._t); $('buscar')._t=setTimeout(pintar,150); });
$('actualizar').addEventListener('click', ()=>cargar());
$('tPart').addEventListener('click', ()=>{ TAB='part'; $('tPart').setAttribute('aria-selected','true'); $('tArb').setAttribute('aria-selected','false'); pintar(); });
$('tArb').addEventListener('click', ()=>{ TAB='arb'; $('tArb').setAttribute('aria-selected','true'); $('tPart').setAttribute('aria-selected','false'); pintar(); });
$('copiar').addEventListener('click', async ()=>{
  const url = new URL('../disponibilidad/', location.href).href + '?finde=' + FINDE;
  try{ await navigator.clipboard.writeText(url); msg(t('copiado'),'ok'); }catch(e){ prompt('', url); }
});

/* ---------- Alta o edición a mano ---------- */
let EDIT=null;
const radio = n => document.querySelector(`input[name="${n}"]:checked`)?.value;
const setRadio = (n,v) => document.querySelectorAll(`input[name="${n}"]`).forEach(i=>i.checked = i.value===v);
function abrirAlta(a){
  EDIT=a||null; $('hAlta').textContent = a ? t('editar') : t('nuevo'); $('amsg').innerHTML='';
  $('aLSab').textContent = `${t('sabado')} ${fecha(FINDE,0)}`; $('aLDom').textContent = `${t('domingo')} ${fecha(FINDE,1)}`;
  $('aNombre').value=a?.nombre||''; $('aPob').value=a?.poblacion||''; setRadio('aCoche', a?(a.coche?'1':'0'):''); setRadio('aSab', a?.sab||''); setRadio('aDom', a?.dom||'');
  $('aSabObs').value=a?.sab_obs||''; $('aDomObs').value=a?.dom_obs||'';
  $('alta').classList.remove('hidden'); $('aNombre').focus();
}
const cerrarAlta = ()=>{ $('alta').classList.add('hidden'); $('nuevo').focus(); };
$('nuevo').addEventListener('click', ()=>abrirAlta(null));
$('aCancelar').addEventListener('click', cerrarAlta);
$('alta').addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarAlta(); });
$('fAlta').addEventListener('submit', async e=>{
  e.preventDefault();
  const body={action:'alta', finde:FINDE, id:EDIT?.id, nombre:$('aNombre').value.trim(), poblacion:$('aPob').value.trim(), coche: radio('aCoche')==='1'?true:radio('aCoche')==='0'?false:undefined,
    sab:radio('aSab'), dom:radio('aDom'), sab_obs:$('aSabObs').value.trim(), dom_obs:$('aDomObs').value.trim()};
  if(body.nombre.length<3 || body.poblacion.length<2 || body.coche===undefined || !body.sab || !body.dom){ $('amsg').innerHTML=`<p class="msg err">${esc(t('falta'))}</p>`; return; }
  $('aGuardar').disabled=true; const r=await api(body); $('aGuardar').disabled=false;
  if(!r.ok){ $('amsg').innerHTML=`<p class="msg err">${esc(r.error||t('red'))}</p>`; return; }
  cerrarAlta(); msg(t('guardado'),'ok'); cargar();
});

/* ---------- Excel ---------- */
$('exportar').addEventListener('click', async ()=>{
  if(!window.XLSX) await new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src='../vendor/xlsx-0.18.5.full.min.js'; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
  const plan=PLAN(), arb=ARB(), n = id => id&&arb[id] ? corto(arb[id].nombre) : '';
  const rows = filtrados(plan).map(m=>{ const p=plan[m.key]||{}; return { Fecha:m.d.slice(0,10), Hora:m.d.slice(11,16), Categoría:cat(m.cat), Local:corto(m.l), Visitante:corto(m.v),
    Pabellón:corto(m.pab), Dirección:m.pista, R1:n(p.r1), R2:n(p.r2), Anotador:n(p.an), 'Km R1 (aprox.)': p.r1&&arb[p.r1] ? kmAct(arb[p.r1], m, plan).k ?? '' : '', [t('hecho')]: HECHO().has(m.key) ? '✓' : '' }; });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), t('xlsHoja'));
  XLSX.utils.book_append_sheet(wb, hojaDisp(filasDisp()), t('xlsDisp'));   // la disponibilidad, como la plantilla de importar
  XLSX.writeFile(wb, `designaciones-${FINDE}.xlsx`);
});

</script>

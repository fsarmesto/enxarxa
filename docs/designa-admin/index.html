<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://vevsurxxvjivjizuuqad.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Designaciones · Vòlei EnXarxa</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="../designa.css">
<style>
.board .acts{position:absolute;top:0;right:0;display:flex;gap:8px;align-items:center}
.board .acts .lang{position:static}
.board .salir{color:#fff;border-color:#fff;min-height:32px;padding:0 10px;font-size:14px}
#login{max-width:380px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px}
.kpis div{font-size:13.5px;color:var(--ink-2)} .kpis b{display:block;font:700 24px/1 var(--display);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.bar .opts label{min-height:38px;padding:2px 12px}
.bar input[type=search]{width:auto;flex:1;min-width:180px;margin:0}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-height:38px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin:0 0 12px}
.tabs button{border:0;border-bottom:4px solid transparent;border-radius:0;margin-bottom:-2px;padding:0 14px;font-family:var(--display);font-size:19px;font-weight:600}
.tabs button[aria-selected="true"]{border-bottom-color:var(--yellow)}
.dia-h{font-family:var(--display);font-size:22px;margin:18px 0 8px}
.m{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--surface)}
.m.ok{border-left:5px solid var(--ok)} .m.falta{border-left:5px solid var(--yellow)} .m.mal{border-left-color:var(--warn)}
.choque{margin:6px 0 0;font-size:13.5px;font-weight:600} .choque.pisa{color:var(--warn)} .choque.justo{color:var(--ink-2)}
.m .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.m .hora{font:700 20px/1 var(--display)}
.m .eq{font-weight:700}
.m .pab{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.slots label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.slots select{margin-top:2px;min-height:40px;padding:6px 8px;font-size:14px}
.slots .s-mas{display:none}
.recs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.recs .l{font-size:12.5px;color:var(--ink-3);font-weight:600}
.recs button{min-height:34px;padding:0 10px;border-width:1px;border-radius:17px;font-size:13.5px;font-weight:600}
.recs button small{font-weight:400;color:var(--ink-2)}
.a{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.a .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.a .n{font-weight:700;font-size:16px}
.a .d{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.a .acts{margin-top:8px}
.a .acts button{min-height:34px;font-size:13.5px;padding:0 10px}
#alta{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:10}
#alta form{max-width:520px;width:100%}
@media (max-width:600px){
  .slots{grid-template-columns:1fr}
  .slots:not(.mas) :is(.s-r2,.s-an){display:none}
  .slots:not(.mas) .s-mas{display:inline-flex;justify-self:start;min-height:36px;padding:0;font-size:13.5px}
  .board .acts{position:static;margin-top:8px}
  .bar input[type=search]{flex-basis:100%}
}
</style>
</head>
<body>
<header class="board"><div class="in">
  <div class="acts"><button type="button" class="salir hidden" id="salir" data-t="salir">Salir</button><div class="lang" role="group" aria-label="Idioma"><button type="button" data-set="es">ES</button><button type="button" data-set="ca">CA</button></div></div>
  <h1 data-t="titulo">Designaciones</h1>
  <p class="sub" id="sub" data-t="subLogin">Fin de semana · FCVB</p>
</div></header>

<main id="login">
  <form class="card" id="fLogin" novalidate>
    <h2 data-t="entrar">Entrar</h2>
    <div id="lmsg" role="status" aria-live="polite"></div>
    <label class="f"><span data-t="usuario">Usuario</span><input type="text" id="usuario" autocomplete="username" autocapitalize="none" required></label>
    <label class="f"><span data-t="clave">Contraseña</span><input type="password" id="clave" autocomplete="current-password" required></label>
    <button type="submit" class="primary" id="bLogin" data-t="entrar">Entrar</button>
  </form>
</main>

<main class="wide hidden" id="app">
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="bar">
    <div class="opts" id="findes" role="radiogroup" aria-label="Fin de semana"></div>
    <button type="button" id="actualizar" data-t="actualizar">Actualizar</button>
    <button type="button" id="exportar" data-t="exportar">Exportar a Excel</button>
    <button type="button" id="copiar" data-t="copiarEnlace">Copiar enlace del formulario</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" role="tablist"><button type="button" role="tab" id="tPart" aria-selected="true" data-t="partidos">Partidos</button><button type="button" role="tab" id="tArb" aria-selected="false">Árbitros</button></div>
  <section id="vPart">
    <div class="bar">
      <div class="opts" role="radiogroup" aria-label="Día" id="dias"></div>
      <label class="chk"><input type="checkbox" id="soloLiga" checked> <span data-t="soloLiga">Solo liga (sin alevín, máster ni amateur)</span></label>
      <label class="chk hidden" id="lSinIsq"><input type="checkbox" id="soloSinIsq"> <span data-t="soloSinIsq">Solo sin árbitro en iSquad</span></label>
      <label class="chk"><input type="checkbox" id="soloPend"> <span data-t="soloPend">Solo sin R1 en el plan</span></label>

  <section id="vArb" class="hidden">

</main>

    <h2 id="hAlta" data-t="nuevo">Añadir árbitro</h2>

    <label class="f"><span data-t="nombre">Nombre y apellidos</span><input type="text" id="aNombre" maxlength="80"></label>
    <label class="f"><span data-t="poblacion">Población</span><input type="text" id="aPob" maxlength="80"></label>
    <fieldset><legend data-t="coche">¿Tiene coche?</legend><div class="opts"><label><input type="radio" name="aCoche" value="1"><span data-t="si">Sí</span></label><label><input type="radio" name="aCoche" value="0"><span data-t="no">No</span></label></div></fieldset>
    <fieldset><legend id="aLSab" data-t="sabado">Sábado</legend><div class="opts" id="aSab"></div></fieldset>
    <label class="f"><span data-t="obs">Observaciones</span><input type="text" id="aSabObs" maxlength="300"></label>
    <fieldset><legend id="aLDom" data-t="domingo">Domingo</legend><div class="opts" id="aDom"></div></fieldset>

    <div class="row"><button type="submit" class="primary" id="aGuardar" data-t="guardar">Guardar</button><button type="button" id="aCancelar" data-t="cancelar">Cancelar</button></div>

</div>

<script src="../config.js"></script>
<script>
const T = {
  es: { titulo:'Designaciones', subLogin:'Fin de semana · FCVB', entrar:'Entrar', usuario:'Usuario', clave:'Contraseña', salir:'Salir', actualizar:'Actualizar', exportar:'Exportar a Excel',
    copiarEnlace:'Copiar enlace del formulario', copiado:'Enlace copiado. Pásalo a los árbitros.', partidos:'Partidos', arbitros:n=>`Árbitros (${n})`, soloLiga:'Solo liga (sin alevín, máster ni amateur)',
    soloSinIsq:'Solo sin árbitro en iSquad', soloPend:'Solo sin R1 en el plan', buscar:'Buscar equipo, pabellón o categoría', nuevo:'Añadir árbitro', editar:'Editar árbitro',
    nuevoH:'Para quien te ha dado la disponibilidad por teléfono o WhatsApp.', nombre:'Nombre y apellidos', poblacion:'Población', coche:'¿Tiene coche?', si:'Sí', no:'No',
    sabado:'Sábado', domingo:'Domingo', obs:'Observaciones', guardar:'Guardar', cancelar:'Cancelar', manana:'Mañana', tarde:'Tarde', ambas:'Mañana y tarde', noPuede:'No',
    todo:'Todo', finde:(a,b)=>`Fin de semana del ${a} y ${b}`, este:'Este fin de semana', siguiente:'El siguiente', cargando:'Cargando…',
    ubicando:n=>`Ubicando ${n} pabellones en el mapa… las distancias se completan solas.`, kPart:'partidos', kR1:'con R1 en el plan', kDisp:'árbitros disponibles', kSinIsq:'sin árbitro en iSquad',
    r1:'R1', r2:'R2', an:'Anotador', masRoles:'+ R2 y anotador', nadie:'—', recomendados:'Recomendados:', sinRec:'Nadie disponible a esta hora.', sinCoche:'sin coche', km:k=>`≈ ${k} km`,
    grpRec:'Recomendados', grpOtros:'Disponibles (lejos o con poco margen)', grpNo:'No disponibles a esta hora', ocupado:'otro partido', noDisp:'no disponible',
    grpPisa:'Ya tienen un partido a esta hora', yaTiene:x=>`ya tiene ${x}`, justo:x=>`poco margen: ${x}`, enIsq:'iSquad', enIsqL:'En iSquad:',
    avPisa:(n,x)=>`${n} ya tiene el partido de las ${x}: no puede estar en 2 partidos a la vez.`, avJusto:(n,x)=>`Ojo: ${n} tiene el partido de las ${x} y va justo de tiempo para el viaje.`,
    yaAqui:n=>`${n} ya está en este partido.`,
    isqCon:'Con árbitro en iSquad', isqSin:'Sin árbitro en iSquad', aplazado:'Fecha sin confirmar', sinPartidos:'No hay partidos con estos filtros.',
    sinArb:'Todavía nadie ha dado disponibilidad para este fin de semana. Copia el enlace del formulario y pásalo a los árbitros.',
    app:'con cuenta', mano:'a mano', porTi:'añadido por ti', asignados:n=>n===1?'1 partido':`${n} partidos`, cercanos:'Más cercanos sin R1:', ninguno:'Ningún partido libre a su hora.',
    quitar:'Quitar', confirmarQuitar:n=>`¿Quitar a ${n}? También sale de los partidos donde lo has puesto.`, editarB:'Editar',
    falta:'Rellena nombre, población, coche y los dos días.', red:'Sin conexión. Inténtalo de nuevo.', guardado:'Guardado.', caducada:'La sesión ha caducado. Vuelve a entrar.',
    planNota:'Es solo tu plan: pásalo a iSquad como siempre.', xlsHoja:'Designaciones', obsC:'obs.' },
  ca: { titulo:'Designacions', subLogin:'Cap de setmana · FCVB', entrar:'Entra', usuario:'Usuari', clave:'Contrasenya', salir:'Surt', actualizar:'Actualitza', exportar:'Exporta a Excel',
    copiarEnlace:'Copia l\'enllaç del formulari', copiado:'Enllaç copiat. Passa\'l als àrbitres.', partidos:'Partits', arbitros:n=>`Àrbitres (${n})`, soloLiga:'Només lliga (sense aleví, màster ni amateur)',
    soloSinIsq:'Només sense àrbitre a iSquad', soloPend:'Només sense R1 al pla', buscar:'Cerca equip, pavelló o categoria', nuevo:'Afegeix àrbitre', editar:'Edita l\'àrbitre',
    nuevoH:'Per a qui t\'ha donat la disponibilitat per telèfon o WhatsApp.', nombre:'Nom i cognoms', poblacion:'Població', coche:'Té cotxe?', si:'Sí', no:'No',
    sabado:'Dissabte', domingo:'Diumenge', obs:'Observacions', guardar:'Desa', cancelar:'Cancel·la', manana:'Matí', tarde:'Tarda', ambas:'Matí i tarda', noPuede:'No',
    todo:'Tot', finde:(a,b)=>`Cap de setmana del ${a} i ${b}`, este:'Aquest cap de setmana', siguiente:'El següent', cargando:'Carregant…',
    ubicando:n=>`Situant ${n} pavellons al mapa… les distàncies es completen soles.`, kPart:'partits', kR1:'amb R1 al pla', kDisp:'àrbitres disponibles', kSinIsq:'sense àrbitre a iSquad',
    r1:'R1', r2:'R2', an:'Anotador', masRoles:'+ R2 i anotador', nadie:'—', recomendados:'Recomanats:', sinRec:'Ningú disponible a aquesta hora.', sinCoche:'sense cotxe', km:k=>`≈ ${k} km`,
    grpRec:'Recomanats', grpOtros:'Disponibles (lluny o amb poc marge)', grpNo:'No disponibles a aquesta hora', ocupado:'un altre partit', noDisp:'no disponible',
    grpPisa:'Ja tenen un partit a aquesta hora', yaTiene:x=>`ja té ${x}`, justo:x=>`poc marge: ${x}`, enIsq:'iSquad', enIsqL:'A iSquad:',
    avPisa:(n,x)=>`${n} ja té el partit de les ${x}: no pot ser a 2 partits alhora.`, avJusto:(n,x)=>`Compte: ${n} té el partit de les ${x} i va just de temps per al viatge.`,
    yaAqui:n=>`${n} ja és en aquest partit.`,
    isqCon:'Amb àrbitre a iSquad', isqSin:'Sense àrbitre a iSquad', aplazado:'Data sense confirmar', sinPartidos:'No hi ha partits amb aquests filtres.',
    sinArb:'Encara ningú no ha donat disponibilitat per a aquest cap de setmana. Copia l\'enllaç del formulari i passa\'l als àrbitres.',
    app:'amb compte', mano:'a mà', porTi:'afegit per tu', asignados:n=>n===1?'1 partit':`${n} partits`, cercanos:'Més propers sense R1:', ninguno:'Cap partit lliure a la seva hora.',
    quitar:'Treu', confirmarQuitar:n=>`Treure ${n}? També surt dels partits on l\'has posat.`, editarB:'Edita',
    falta:'Omple nom, població, cotxe i els dos dies.', red:'Sense connexió. Torna-ho a provar.', guardado:'Desat.', caducada:'La sessió ha caducat. Torna a entrar.',
    planNota:'És només el teu pla: passa\'l a iSquad com sempre.', xlsHoja:'Designacions', obsC:'obs.' }
};
let LANG='es'; try{ LANG = localStorage.getItem('liq-lang') || ((navigator.language||'').toLowerCase().startsWith('ca')?'ca':'es'); }catch(e){}
const t = k => T[LANG][k] ?? T.es[k];
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FN = window.APP_CONFIG.SUPABASE_URL + '/functions/v1/designa';
let TOKEN = ''; try{ const x = JSON.parse(localStorage.getItem('designa-sesion')||'null'); if(x && x.exp > Date.now()) TOKEN = x.token; }catch(e){}
async function api(body){
  let r; try{ r = await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.APP_CONFIG.SUPABASE_ANON_KEY,...(TOKEN?{'x-designa-token':TOKEN}:{})},body:JSON.stringify(body)}); }
  catch(e){ return {ok:false,error:t('red')}; }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(r.status===401 && body.action!=='login'){ salir(t('caducada')); }
  return {...j, ok:r.ok && j.ok!==false};
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(e=>{ const v=t(e.dataset.t); if(typeof v==='string') e.textContent=v; });
  document.querySelectorAll('[data-tp]').forEach(e=>{ e.placeholder=t(e.dataset.tp); e.setAttribute('aria-label', t(e.dataset.tp)); });
  document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.set===LANG)));
  for(const [id,n] of [['aSab','aSab'],['aDom','aDom']]) $(id).innerHTML = ['manana','tarde','ambas','no'].map(v=>`<label><input type="radio" name="${n}" value="${v}"><span>${esc(v==='no'?t('noPuede'):t(v))}</span></label>`).join('');
  if(D) pintar();
}
document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.set; try{localStorage.setItem('liq-lang',LANG);}catch(e){} applyLang(); }));

/* ---------- Login ---------- */
function salir(aviso){
  TOKEN=''; try{ localStorage.removeItem('designa-sesion'); }catch(e){}
  D=null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('salir').classList.add('hidden');
  $('sub').textContent = t('subLogin'); $('lmsg').innerHTML = aviso ? `<p class="msg err">${esc(aviso)}</p>` : '';
}
$('salir').addEventListener('click', ()=>salir());
$('fLogin').addEventListener('submit', async e=>{
  e.preventDefault();
  const b=$('bLogin'); b.disabled=true;
  const r = await api({action:'login', usuario:$('usuario').value.trim(), clave:$('clave').value});
  b.disabled=false;
  if(!r.ok){ $('lmsg').innerHTML = `<p class="msg err">${esc(r.error||t('red'))}</p>`; return; }
  TOKEN=r.token; try{ localStorage.setItem('designa-sesion', JSON.stringify({token:r.token, exp:r.exp})); }catch(e){}
  $('clave').value=''; entrarApp();
});

/* ---------- Datos ---------- */
let D=null, FINDE=null, DIA='todo', TAB='part', CARGANDO=false;
function entrarApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('salir').classList.remove('hidden'); cargar(); }
async function cargar(f){
  if(CARGANDO) return; CARGANDO=true;
  if(!D) $('lista').innerHTML = `<p class="muted">${esc(t('cargando'))}</p>`;
  $('actualizar').disabled=true;
  const r = await api({action:'panel', finde:f||FINDE||undefined});
  $('actualizar').disabled=false; CARGANDO=false;
  if(!r.ok){ if(TOKEN) msg(r.error||t('red'),'err'); return; }
  D=r; FINDE=r.finde; msg('');
  pintar();
  // Pabellones sin ubicar todavía: el servidor sigue por tandas.
  if(r.falta>0) setTimeout(()=>cargar(), 1500);
}
function msg(text, kind){ $('msg').innerHTML = text ? `<p class="msg ${kind}">${esc(text)}</p>` : ''; }
const fecha = (d, n, o={day:'numeric',month:'long'}) => new Intl.DateTimeFormat(LANG==='ca'?'ca-ES':'es-ES',{...o,timeZone:'UTC'}).format(new Date(Date.parse(d+'T12:00:00Z')+n*864e5));
const dia = m => m.d.slice(0,10)===FINDE ? 'sab' : 'dom';
const mins = m => +m.d.slice(11,13)*60 + +m.d.slice(14,16);   // m = partido u ocupación (con .d)
const franja = m => mins(m) < 15*60 ? 'manana' : 'tarde';
// Distancia aproximada por carretera: línea recta × 1,25 (sin gastar rutas; solo para ordenar y orientar).
function km(a, m){
  if(a.lat==null || m.lat==null) return null;
  const R=6371, r=x=>x*Math.PI/180, dLa=r(m.lat-a.lat), dLo=r(m.lon-a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(m.lat))*Math.sin(dLo/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h))*1.25);
}
const PLAN = () => { const p={}; for(const x of D.asig) (p[x.match_key] ||= {})[x.rol]=x.disp_id; return p; };
const ARB = () => Object.fromEntries(D.disp.map(a=>[a.id,a]));
const disponible = (a, m) => { const v=a[dia(m)]; return v==='ambas' || v===franja(m); };
// ¿Choca con otro partido suyo? (4-nov-2026, Ferran: nadie puede estar en 2 partidos a la vez.) Misma regla que el
// servidor (supabase/functions/designa, choqueDe):
// - 'pisa': inicios a menos de 1 h 45 min, sea cual sea el pabellón → no se puede elegir (y el servidor lo rechaza).
// - 'justo': otro pabellón sin margen para el viaje (1 h 45 min + ≈1 min por km + 15 min; sin distancia, 2 h 30 min) → solo aviso.
// Cuenta su plan en este panel y, si tiene cuenta en la app, lo que ya tiene designado en iSquad (a.isq).
const PISA=105;
const sinPista = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s*-\s*(PISTA|TERCIO|TERC|CAMP|SALA|ANNEX).*$/,'').replace(/\s+/g,' ').trim();
const mismoPab = (a,b) => { const x=sinPista(a), y=sinPista(b); return !!x && !!y && (x===y || x.includes(y) || y.includes(x)); };
function kmEntre(x, m){ return x.lat==null || m.lat==null ? null : km({lat:x.lat, lon:x.lon, coche:true}, m); }
function ocupaciones(a, plan){
  const out=[];
  for(const x of D.partidos){ const p=plan[x.key]; if(p && Object.values(p).includes(a.id)) out.push({m:x, d:x.d, pab:x.pab, plan:true}); }
  for(const o of a.isq||[]){
    const x = D.partidos.find(m=>m.d===o.d && mismoPab(m.pab,o.pab));
    out.push({m:x||null, d:o.d, pab:x?.pab||o.pab, isq:true});
  }
  return out;
}
function choque(a, m, plan){
  let justo=null;
  for(const o of ocupaciones(a, plan)){
    if(o.d.slice(0,10)!==m.d.slice(0,10)) continue;
    if(o.m && o.m.key===m.key) { if(o.isq) continue; if(o.plan) return {tipo:'pisa', o, aqui:true}; }
    const gap=Math.abs(mins(o)-mins(m));
    if(gap < PISA) return {tipo:'pisa', o};
    if(!mismoPab(o.pab, m.pab)){ const k=o.m?kmEntre(o.m,m):null; if(gap < (k==null?150:PISA+k+15)) justo ||= {tipo:'justo', o}; }
  }
  return justo;
}
const ocupado = (a, m, plan) => !!choque(a, m, plan);
const cuantos = (a, plan) => Object.values(plan).reduce((n,p)=>n+Object.values(p).filter(id=>id===a.id).length, 0);
function candidatos(m, plan){
  const yaEn = new Set(Object.values(plan[m.key]||{}));
  return D.disp.filter(a=>!yaEn.has(a.id)).map(a=>{
    const k=km(a,m), disp=disponible(a,m), ch=choque(a,m,plan), pisa=ch?.tipo==='pisa', oc=disp && ch?.tipo==='justo', lejosSinCoche = !a.coche && (k==null || k>12);
    return {a, k, disp, ch, pisa, oc, lejosSinCoche, score:(k??60) + (lejosSinCoche?1000:0) + cuantos(a,plan)*5};
  }).sort((x,y)=>x.score-y.score || x.a.nombre.localeCompare(y.a.nombre));
}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const corto = s => String(s||'').toLowerCase().replace(/(^|[\s'·(-])(\p{L})/gu,(_,a,b)=>a+b.toUpperCase());
function cat(c){
  const n=String(c||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(), d=n.match(/^(PRIMERA|SEGUNDA|TERCERA|CUARTA) DIVISION/)?.[1];
  const div = d ? {PRIMERA:'1ª',SEGUNDA:'2ª',TERCERA:'3ª',CUARTA:'4ª'}[d] : /PREFERENTE/.test(n) ? 'Pref.' : '';
  const age = /SENIOR/.test(n)?'Sénior':/JUNIOR/.test(n)?'Júnior':/JUVENIL/.test(n)?'Juvenil':/CADETE/.test(n)?'Cadete':/INFANTIL/.test(n)?'Infantil':'';
  const gen = /FEMENINO/.test(n)?(LANG==='ca'?'Fem.':'Fem.'):/MASCULINO/.test(n)?'Masc.':/MIXTO/.test(n)?(LANG==='ca'?'Mixt':'Mixto'):'';
  return age ? [div,age,gen].filter(Boolean).join(' ') : corto(c);
}
const pobDe = m => (m.pista.match(/\d{5}\s+([^,]+)/)?.[1] || '').trim();
// "8:00 · Pavelló Congost (iSquad)" de una ocupación, para avisos y desplegables.
const pabCorto = s => corto(String(s||'').replace(/\s*-\s*(PISTA|TERCIO|TERC|CAMP|SALA|ANNEX).*$/i,'').trim());   // sin la pista, con acentos
const ocTxt = o => `${o.d.slice(11,16)} · ${pabCorto(o.pab)}${o.isq?' ('+t('enIsq')+')':''}`;

/* ---------- Pintar ---------- */
function pintar(){
  const solo = FINDE.slice(5,7)===new Date(Date.parse(FINDE+'T12:00:00Z')+864e5).toISOString().slice(5,7) ? String(+FINDE.slice(8,10)) : fecha(FINDE,0);
  $('sub').textContent = t('finde')(solo, fecha(FINDE,1));
  $('findes').innerHTML = D.findes.map((f,i)=>`<label><input type="radio" name="finde" value="${f}"${f===FINDE?' checked':''}><span>${esc(i?t('siguiente'):t('este'))} · ${esc(fecha(f,0,{day:'numeric',month:'short'}))}</span></label>`).join('');
  $('dias').innerHTML = [['todo',t('todo')],['sab',t('sabado')],['dom',t('domingo')]].map(([v,l])=>`<label><input type="radio" name="dia" value="${v}"${v===DIA?' checked':''}><span>${esc(l)}</span></label>`).join('');
  $('lSinIsq').classList.toggle('hidden', !D.estadoIsquad);
  $('tArb').textContent = t('arbitros')(D.disp.length);
  const plan=PLAN(), liga=D.partidos.filter(m=>m.liga);
  const disp = D.disp.filter(a=>a.sab!=='no'||a.dom!=='no').length;
  $('kpis').innerHTML = `<div><b>${liga.length}</b>${esc(t('kPart'))}</div><div><b>${liga.filter(m=>plan[m.key]?.r1).length}</b>${esc(t('kR1'))}</div>`
    + (D.estadoIsquad ? `<div><b>${liga.filter(m=>m.isquad==='sin').length}</b>${esc(t('kSinIsq'))}</div>` : '') + `<div><b>${disp}</b>${esc(t('kDisp'))}</div>`;
  const ub=$('ubicando'); ub.classList.toggle('hidden', !(D.falta>0)); if(D.falta>0) ub.textContent=t('ubicando')(D.falta);
  TAB==='part' ? pintarPartidos(plan) : pintarArbitros(plan);
}
function filtrados(plan){
  const q=$('buscar').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return D.partidos.filter(m=>(DIA==='todo'||dia(m)===DIA) && (!$('soloLiga').checked||m.liga) && (!$('soloSinIsq').checked||!D.estadoIsquad||m.isquad==='sin')
    && (!$('soloPend').checked||!plan[m.key]?.r1)
    && (!q || [m.l,m.v,m.pab,m.pista,m.cat].join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)));
}
function opciones(m, rol, plan){
  const sel = plan[m.key]?.[rol], arb=ARB(), cs=candidatos(m, plan);
  const op = c => `<option value="${c.a.id}"${c.pisa?' disabled':''}>${esc(corto(c.a.nombre))}${c.pisa?' · '+esc(t('yaTiene')(ocTxt(c.ch.o))):''}${!c.pisa&&c.k!=null?' · '+esc(t('km')(c.k)):''}${!c.pisa&&!c.a.coche?' · '+esc(t('sinCoche')):''}${c.oc?' · '+esc(t('justo')(ocTxt(c.ch.o))):''}${!c.pisa&&!c.disp?' · '+esc(t('noDisp')):''}</option>`;
  const rec=cs.filter(c=>c.disp&&!c.pisa&&!c.oc&&!c.lejosSinCoche), otros=cs.filter(c=>c.disp&&!c.pisa&&(c.oc||c.lejosSinCoche)), no=cs.filter(c=>!c.disp&&!c.pisa), pisan=cs.filter(c=>c.pisa);
  const actual = sel && arb[sel] ? `<option value="${sel}" selected>${esc(corto(arb[sel].nombre))}${km(arb[sel],m)!=null?' · '+esc(t('km')(km(arb[sel],m))):''}</option>` : '';
  return `<option value="">${esc(t('nadie'))}</option>${actual}`
    + (rec.length?`<optgroup label="${esc(t('grpRec'))}">${rec.map(op).join('')}</optgroup>`:'')
    + (otros.length?`<optgroup label="${esc(t('grpOtros'))}">${otros.map(op).join('')}</optgroup>`:'')
    + (no.length?`<optgroup label="${esc(t('grpNo'))}">${no.map(op).join('')}</optgroup>`:'')
    + (pisan.length?`<optgroup label="${esc(t('grpPisa'))}">${pisan.map(op).join('')}</optgroup>`:'');
}
function pintarPartidos(plan){
  $('vPart').classList.remove('hidden'); $('vArb').classList.add('hidden');
  const ms=filtrados(plan);
  if(!ms.length){ $('lista').innerHTML=`<p class="muted">${esc(t('sinPartidos'))}</p>`; return; }
  let html='', ult='';
  for(const m of ms){
    const d=m.d.slice(0,10);
    if(d!==ult){ ult=d; html+=`<h2 class="dia-h">${esc(cap(fecha(d,0,{weekday:'long',day:'numeric',month:'long'})))}</h2>`; }
    const p=plan[m.key]||{}, recs=candidatos(m,plan).filter(c=>c.disp&&!c.pisa&&!c.oc&&!c.lejosSinCoche).slice(0,4), arb=ARB();
    // Choques de los que ya están puestos (p. ej. puestos antes de esta regla, o designados después en iSquad).
    const avisos=['r1','r2','an'].map(rol=>{ const a=arb[p[rol]]; if(!a) return ''; const sinEste={...plan, [m.key]:Object.fromEntries(Object.entries(p).filter(([r])=>r!==rol))}, ch=choque(a,m,sinEste);
      return ch ? `<p class="choque ${ch.tipo}">${esc((ch.tipo==='pisa'?t('avPisa'):t('avJusto'))(corto(a.nombre), ocTxt(ch.o)))}</p>` : ''; }).join('');
    const id=encodeURIComponent(m.key);
    html+=`<article class="m ${p.r1?'ok':'falta'}${avisos.includes('choque pisa')?' mal':''}" data-key="${esc(m.key)}">
      <div class="top"><span class="hora">${esc(m.d.slice(11,16))}</span><span class="tag" title="${esc(m.cat)}">${esc(cat(m.cat))}</span>${m.isquad==='con'?`<span class="tag g">${esc(t('isqCon'))}</span>`:m.isquad==='sin'?`<span class="tag r">${esc(t('isqSin'))}</span>`:''}${m.conf?'':`<span class="tag">${esc(t('aplazado'))}</span>`}</div>
      <div class="eq">${esc(corto(m.l))} – ${esc(corto(m.v))}</div>
      <div class="pab">${esc(corto(m.pab))}${pobDe(m)?' · '+esc(corto(pobDe(m))):''}</div>
      ${avisos}
      <div class="slots${p.r2||p.an?' mas':''}">${['r1','r2','an'].map(rol=>`<label class="s-${rol}">${esc(t(rol))}<select data-rol="${rol}" aria-label="${esc(t(rol))} · ${esc(corto(m.l))} – ${esc(corto(m.v))}">${opciones(m,rol,plan)}</select></label>`).join('')}<button type="button" class="ghost s-mas" data-mas>${esc(t('masRoles'))}</button></div>
      ${D.disp.length?`<div class="recs"><span class="l">${esc(t('recomendados'))}</span>${recs.length?recs.map(c=>`<button type="button" data-pon="${c.a.id}">${esc(corto(c.a.nombre))} <small>${c.k!=null?esc(t('km')(c.k)):''}${c.a.coche?'':' · '+esc(t('sinCoche'))}</small></button>`).join(''):`<span class="small muted">${esc(t('sinRec'))}</span>`}</div>`:''}
    </article>`;
  }
  $('lista').innerHTML = (D.disp.length?'':`<p class="msg err">${esc(t('sinArb'))}</p>`) + `<p class="small muted">${esc(t('planNota'))}</p>` + html;
}
function pintarArbitros(plan){
  $('vPart').classList.add('hidden'); $('vArb').classList.remove('hidden');
  if(!D.disp.length){ $('arbs').innerHTML=`<p class="msg err">${esc(t('sinArb'))}</p>`; return; }
  const fr = (v,obs)=>`${esc(v==='no'?t('noPuede'):t(v))}${obs?` <span class="muted">(${esc(obs)})</span>`:''}`;
  $('arbs').innerHTML = D.disp.map(a=>{
    const mios = D.partidos.filter(m=>Object.entries(plan[m.key]||{}).some(([,id])=>id===a.id));
    const libres = D.partidos.filter(m=>m.liga && !plan[m.key]?.r1 && disponible(a,m) && !ocupado(a,m,plan)).map(m=>({m,k:km(a,m)}))
      .filter(x=>a.coche || x.k==null || x.k<=12).sort((x,y)=>(x.k??999)-(y.k??999)).slice(0,3);
    return `<article class="a"><div class="top"><span class="n">${esc(corto(a.nombre))}</span><span class="tag">${esc(corto(a.poblacion))}</span>${a.coche?'':`<span class="tag r">${esc(t('sinCoche'))}</span>`}<span class="tag">${esc(a.origen==='designador'?t('porTi'):a.app?t('app'):t('mano'))}</span>${mios.length?`<span class="tag y">${esc(t('asignados')(mios.length))}</span>`:''}</div>
      <div class="d">${esc(t('sabado'))}: ${fr(a.sab,a.sab_obs)} · ${esc(t('domingo'))}: ${fr(a.dom,a.dom_obs)}</div>
      ${(a.isq||[]).length?`<div class="d">${esc(t('enIsqL'))} ${a.isq.map(o=>`${esc(cap(fecha(o.d.slice(0,10),0,{weekday:'short'})))} ${esc(o.d.slice(11,16))} · ${esc(pabCorto(o.pab))}`).join(' · ')}</div>`:''}
      ${mios.length?`<div class="d">${mios.map(m=>`${esc(cap(fecha(m.d.slice(0,10),0,{weekday:'short'})))} ${esc(m.d.slice(11,16))} · ${esc(corto(m.l))} – ${esc(corto(m.v))} (${esc(t(Object.entries(plan[m.key]).find(([,id])=>id===a.id)[0]))})`).join('<br>')}</div>`:''}
      <div class="recs"><span class="l">${esc(t('cercanos'))}</span>${libres.length?libres.map(x=>`<button type="button" data-asig="${esc(x.m.key)}" data-arb="${a.id}">${esc(cap(fecha(x.m.d.slice(0,10),0,{weekday:'short'})))} ${esc(x.m.d.slice(11,16))} · ${esc(corto(x.m.pab))} <small>${x.k!=null?esc(t('km')(x.k)):''}</small></button>`).join(''):`<span class="small muted">${esc(t('ninguno'))}</span>`}</div>
      <div class="acts row"><button type="button" data-edit="${a.id}">${esc(t('editarB'))}</button><button type="button" class="ghost" data-quitar="${a.id}">${esc(t('quitar'))}</button></div></article>`;
  }).join('');
}

/* ---------- Acciones ---------- */
async function asignar(key, rol, id){
  // Nadie en 2 partidos a la vez: ni se intenta (el servidor también lo rechaza).
  if(id){ const a=ARB()[id], m=D.partidos.find(x=>x.key===key), plan=PLAN(); if(plan[key]) plan[key]={...plan[key]}, delete plan[key][rol];
    const ch = a && m && choque(a, m, plan); if(ch?.tipo==='pisa'){ msg(ch.aqui?t('yaAqui')(corto(a.nombre)):t('avPisa')(corto(a.nombre), ocTxt(ch.o)),'err'); pintar(); return; } }
  // Al momento en pantalla; si el servidor falla, se recarga lo guardado.
  D.asig = D.asig.filter(x=>!(x.match_key===key && x.rol===rol)); if(id) D.asig.push({match_key:key, rol, disp_id:id});
  pintar();
  const r = await api({action:'asignar', finde:FINDE, key, rol, disp_id:id||null});
  if(!r.ok){ msg(r.error||t('red'),'err'); cargar(); }
}
$('lista').addEventListener('change', e=>{ const s=e.target.closest('select[data-rol]'); if(!s) return; asignar(s.closest('[data-key]').dataset.key, s.dataset.rol, s.value); });
$('lista').addEventListener('click', e=>{
  const mas=e.target.closest('button[data-mas]'); if(mas){ const sl=mas.closest('.slots'); sl.classList.add('mas'); sl.querySelector('.s-r2 select').focus(); return; }
  const b=e.target.closest('button[data-pon]'); if(!b) return;
  const key=b.closest('[data-key]').dataset.key, p=PLAN()[key]||{}, rol=['r1','r2','an'].find(r=>!p[r]); if(rol) asignar(key, rol, b.dataset.pon);
});
$('arbs').addEventListener('click', async e=>{
  const as=e.target.closest('button[data-asig]'); if(as){ asignar(as.dataset.asig, 'r1', as.dataset.arb); return; }
  const ed=e.target.closest('button[data-edit]'); if(ed){ abrirAlta(ARB()[ed.dataset.edit]); return; }
  const q=e.target.closest('button[data-quitar]'); if(q){ const a=ARB()[q.dataset.quitar]; if(!confirm(t('confirmarQuitar')(corto(a.nombre)))) return;
    const r=await api({action:'quitar', finde:FINDE, id:a.id}); if(!r.ok){ msg(r.error||t('red'),'err'); } cargar(); }
});
$('findes').addEventListener('change', e=>{ if(e.target.name==='finde'){ FINDE=e.target.value; D=null; cargar(FINDE); } });
$('dias').addEventListener('change', e=>{ if(e.target.name==='dia'){ DIA=e.target.value; pintar(); } });
for(const id of ['soloLiga','soloSinIsq','soloPend']) $(id).addEventListener('change', pintar);
$('buscar').addEventListener('input', ()=>{ clearTimeout($('buscar')._t); $('buscar')._t=setTimeout(pintar,150); });
$('actualizar').addEventListener('click', ()=>cargar());
$('tPart').addEventListener('click', ()=>{ TAB='part'; $('tPart').setAttribute('aria-selected','true'); $('tArb').setAttribute('aria-selected','false'); pintar(); });
$('tArb').addEventListener('click', ()=>{ TAB='arb'; $('tArb').setAttribute('aria-selected','true'); $('tPart').setAttribute('aria-selected','false'); pintar(); });
$('copiar').addEventListener('click', async ()=>{
  const url = new URL('../disponibilidad/', location.href).href + '?finde=' + FINDE;
  try{ await navigator.clipboard.writeText(url); msg(t('copiado'),'ok'); }catch(e){ prompt('', url); }
});

/* ---------- Alta o edición a mano ---------- */
let EDIT=null;
const radio = n => document.querySelector(`input[name="${n}"]:checked`)?.value;
const setRadio = (n,v) => document.querySelectorAll(`input[name="${n}"]`).forEach(i=>i.checked = i.value===v);
function abrirAlta(a){
  EDIT=a||null; $('hAlta').textContent = a ? t('editar') : t('nuevo'); $('amsg').innerHTML='';
  $('aLSab').textContent = `${t('sabado')} ${fecha(FINDE,0)}`; $('aLDom').textContent = `${t('domingo')} ${fecha(FINDE,1)}`;
  $('aNombre').value=a?.nombre||''; $('aPob').value=a?.poblacion||''; setRadio('aCoche', a?(a.coche?'1':'0'):''); setRadio('aSab', a?.sab||''); setRadio('aDom', a?.dom||'');
  $('aSabObs').value=a?.sab_obs||''; $('aDomObs').value=a?.dom_obs||'';
  $('alta').classList.remove('hidden'); $('aNombre').focus();
}
const cerrarAlta = ()=>{ $('alta').classList.add('hidden'); $('nuevo').focus(); };
$('nuevo').addEventListener('click', ()=>abrirAlta(null));
$('aCancelar').addEventListener('click', cerrarAlta);
$('alta').addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarAlta(); });
$('fAlta').addEventListener('submit', async e=>{
  e.preventDefault();
  const body={action:'alta', finde:FINDE, id:EDIT?.id, nombre:$('aNombre').value.trim(), poblacion:$('aPob').value.trim(), coche: radio('aCoche')==='1'?true:radio('aCoche')==='0'?false:undefined,
    sab:radio('aSab'), dom:radio('aDom'), sab_obs:$('aSabObs').value.trim(), dom_obs:$('aDomObs').value.trim()};
  if(body.nombre.length<3 || body.poblacion.length<2 || body.coche===undefined || !body.sab || !body.dom){ $('amsg').innerHTML=`<p class="msg err">${esc(t('falta'))}</p>`; return; }
  $('aGuardar').disabled=true; const r=await api(body); $('aGuardar').disabled=false;
  if(!r.ok){ $('amsg').innerHTML=`<p class="msg err">${esc(r.error||t('red'))}</p>`; return; }
  cerrarAlta(); msg(t('guardado'),'ok'); cargar();
});

/* ---------- Excel ---------- */
$('exportar').addEventListener('click', async ()=>{
  if(!window.XLSX) await new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src='../vendor/xlsx-0.18.5.full.min.js'; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
  const plan=PLAN(), arb=ARB(), n = id => id&&arb[id] ? corto(arb[id].nombre) : '';
  const rows = filtrados(plan).map(m=>{ const p=plan[m.key]||{}; return { Fecha:m.d.slice(0,10), Hora:m.d.slice(11,16), Categoría:cat(m.cat), Local:corto(m.l), Visitante:corto(m.v),
    Pabellón:corto(m.pab), Dirección:m.pista, R1:n(p.r1), R2:n(p.r2), Anotador:n(p.an), 'Km R1 (aprox.)': p.r1&&arb[p.r1] ? km(arb[p.r1], m) ?? '' : '' }; });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), t('xlsHoja'));
  XLSX.writeFile(wb, `designaciones-${FINDE}.xlsx`);
});

applyLang();
if(TOKEN) entrarApp();
</script>

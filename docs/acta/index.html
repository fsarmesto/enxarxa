<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://vevsurxxvjivjizuuqad.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Acta electrónica · Vòlei EnXarxa</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="../designa.css">
<style>
/* Acta electrónica (prototipo para la FCVB). Móvil en vertical, tablet y portátil: dos mitades (equipo de la izquierda y de
   la derecha, como los ve el anotador) con la pista, el botón de punto y las acciones de cada equipo. */
main.wide{max-width:1180px}
.pasos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:13px;font-weight:700;color:var(--ink-3)}
.pasos span{padding:2px 9px;border-radius:12px;border:1px solid var(--line)}
.pasos span.on{background:var(--yellow);border-color:var(--yellow);color:#000}
.pasos span.ok{color:var(--ok);border-color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 16px}
.lista{width:100%;border-collapse:collapse;font-size:14px}
.lista td,.lista th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.lista input[type=text],.lista input[type=number]{margin:0;min-height:38px;padding:6px 8px}
.lista input.num{width:64px}
.lista .chk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap}
.lista .chk input{width:18px;height:18px}
.x{min-height:36px;padding:0 10px;border-width:1px}
.lista input[aria-invalid="true"]{border-color:var(--red);background:var(--warn-bg);color:var(--warn)}
/* Marcador y mitades */
.marcador{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:#000;color:#fff;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.marcador .eq{font-weight:700;font-size:15px;line-height:1.15;overflow:hidden}
.marcador .eq.d{text-align:right}
.marcador .pts{font:700 54px/1 var(--display);text-align:center;white-space:nowrap}
.marcador .pts small{display:block;font:600 13px/1.3 Barlow,sans-serif;color:#A6A6A6}
.marcador .sets{color:var(--yellow);font:700 18px/1 var(--display)}
.balon{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--yellow);vertical-align:-1px;margin:0 4px}
.mitades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mitad{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);min-width:0}
.pista{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 0 8px;background:var(--surface-2);border-radius:6px;padding:6px;position:relative}
.pista .p{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;border-radius:5px;background:var(--bg);border:1px solid var(--line);font:700 20px/1 var(--display)}
.pista .p small{font:600 10px/1 Barlow,sans-serif;color:var(--ink-3);margin-top:2px}
.pista .p.lib{background:var(--yellow);color:#000;border-color:var(--yellow)}
.pista .p.saca{outline:3px solid var(--red);outline-offset:-3px}
.pista .red{grid-column:1/-1;height:4px;background:var(--ink);border-radius:2px;margin:1px 0}
.btnPunto{width:100%;min-height:76px;font:700 26px/1 var(--display);border-radius:10px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin:0 0 8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{min-height:44px;padding:0 6px;font-size:14px;border-width:1px}
.acts button b{font-weight:400;color:var(--ink-3);margin-left:4px}
.barra{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.registro{font-size:13px;color:var(--ink-2);max-height:180px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.registro div{padding:2px 0}
/* Pantalla de juego: en móvil y tablet, marcador arriba y dos mitades; en PC (desde 1100 px), 3 columnas con la pista real
   en el centro y el panel de cada equipo a su lado. */
.juego{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"marc marc" "izq der" "barra barra" "reg reg";gap:10px}
.j-marc{grid-area:marc;min-width:0}.j-izq{grid-area:izq;min-width:0}.j-der{grid-area:der;min-width:0}.j-cancha{grid-area:cancha;display:none;min-width:0}.j-barra{grid-area:barra}.j-reg{grid-area:reg}
.juego .marcador{margin:0;border:1px solid #2E2E2E}   /* que se vea en el tema oscuro */
.marcador .pts .p-g{opacity:.5;margin:0 .12em}
.marcador .historial{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border-top:1px solid #2E2E2E;padding-top:8px;margin-top:2px}
.marcador .historial span{font:600 13px/1 Barlow,sans-serif;color:#A6A6A6;border:1px solid #2E2E2E;border-radius:12px;padding:4px 9px}
.marcador .historial .gi{border-left:4px solid var(--yellow)} .marcador .historial .gd{border-right:4px solid var(--yellow)}
.solo-pc{display:none}
kbd{display:inline-block;min-width:20px;text-align:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:600 12px/18px Barlow,sans-serif;color:var(--ink);background:var(--surface)}
.registro .h{color:var(--ink-3);font-variant-numeric:tabular-nums;margin-right:8px}
.dots{display:inline-flex;gap:5px;vertical-align:middle}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-3)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:30px;padding:0 6px;border-radius:15px;border:1px solid var(--line);font:700 15px/1 var(--display);background:var(--surface)}
.chip.lib{background:var(--yellow);border-color:var(--yellow);color:#000}
.chip.fuera{text-decoration:line-through;opacity:.5}
.sancs{list-style:none;margin:0;padding:0;font-size:13px}
.sancs li{display:flex;align-items:center;gap:6px;padding:2px 0}
.tarjeta{display:inline-block;width:10px;height:14px;border-radius:2px;background:var(--yellow);flex:none}
.tarjeta.t-castigo,.tarjeta.t-castigoRetraso{background:var(--red)}
.tarjeta.t-expulsion{background:linear-gradient(90deg,var(--yellow) 50%,var(--red) 50%)}
.tarjeta.t-descalificacion{background:var(--red);box-shadow:3px 0 0 var(--yellow)}
.tarjeta.t-impropia{background:transparent;border:2px solid var(--ink-3)}
/* Pista grande */
.cancha{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.c-nom{display:flex;justify-content:space-between;font:700 18px/1.1 var(--display);margin:0 4px 8px}
.c-nom span:last-child{text-align:right}
.c-pista{display:grid;grid-template-columns:1fr 10px 1fr;background:#E9893B;border:4px solid #fff;outline:2px solid #C96F25;border-radius:4px;aspect-ratio:2/1.05}
.campo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);position:relative}
.campo:first-child{background:linear-gradient(90deg,transparent calc(66.6% - 2px),rgba(255,255,255,.9) calc(66.6% - 2px),rgba(255,255,255,.9) 66.6%,transparent 66.6%)}
.campo:last-child{background:linear-gradient(90deg,transparent 33.3%,rgba(255,255,255,.9) 33.3%,rgba(255,255,255,.9) calc(33.3% + 2px),transparent calc(33.3% + 2px))}
.c-pista .red{background:repeating-linear-gradient(0deg,#111 0 3px,#eee 3px 6px);border-left:2px solid #111;border-right:2px solid #111;margin:-10px 0;border-radius:2px}
.jug{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.jug .n{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#fff;color:#000;font:700 30px/1 var(--display);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.jug.lib .n{background:var(--yellow)}
.jug.saca .n{outline:4px solid var(--red);outline-offset:2px}
.jug .cap{position:absolute;top:calc(50% - 44px);right:calc(50% - 40px);background:#000;color:#fff;font:700 11px/18px Barlow,sans-serif;width:18px;height:18px;border-radius:50%;text-align:center}
.jug .pelota{position:absolute;top:calc(50% - 46px);left:calc(50% - 44px);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 30%,var(--yellow) 31%);border:2px solid #000}
.jug .pos{font:600 11px/1 Barlow,sans-serif;color:#fff;margin-top:5px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.c-mesa{text-align:center;font-size:12px;color:var(--ink-3);margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
.solo-movil-i{display:inline}
@media (min-width:1100px){
  main.wide{max-width:1440px}
  .board .in{max-width:1408px}   /* la cabecera, tan ancha como el contenido */
  .juego{grid-template-columns:290px minmax(0,1fr) 290px;grid-template-areas:"izq marc der" "izq cancha der" "izq barra der" "izq reg der";gap:14px 18px;align-items:start}
  .j-cancha{display:block}
  .solo-pc{display:block} .solo-movil{display:none} .solo-movil-i{display:none}
  .mitad{padding:14px;position:sticky;top:10px}
  .m-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
  .m-nom{font:700 24px/1.05 var(--display);min-width:0}
  .m-sets{flex:none;width:46px;height:46px;border-radius:8px;background:#000;color:var(--yellow);display:flex;align-items:center;justify-content:center;font:700 30px/1 var(--display)}
  .btnPunto{min-height:120px;font-size:34px;letter-spacing:.02em}
  .acts button{min-height:48px}
  .m-info{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .m-info h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:12px 0 6px}
  .m-fila{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;padding:3px 0}
  .marcador{padding:14px 20px;border-radius:12px}
  .marcador .eq{font:700 24px/1.1 var(--display)}
  .marcador .sets{font-size:30px;margin-top:4px}
  .marcador .pts{font-size:92px}
  .marcador .pts small{font-size:15px}
  .j-barra .barra{margin:0;justify-content:center}
  .teclas{text-align:center;margin:6px 0 0}
  .j-reg h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0 0 6px}
  .registro{max-height:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);columns:2;column-gap:24px}
  .registro div{break-inside:avoid;border-bottom:1px solid var(--line);padding:5px 0}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .dos .card{margin:0}
}
@media (min-width:1100px) and (max-width:1279px){ .jug .n{width:54px;height:54px;font-size:26px} .marcador .pts{font-size:76px} }
.opcion{display:flex!important;align-items:flex-start;gap:10px;margin:10px 0;font-weight:400;cursor:pointer}
.opcion input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ink)}
.chip.falta{border-color:var(--red);color:var(--warn)}
.setob .nocumple td{background:var(--warn-bg)}
.setob .chk input{width:22px;height:22px;accent-color:var(--ink)}
.ok-t{color:var(--ok);font-weight:700} .no-t{color:var(--warn);font-weight:700}
/* Hoja de diálogo */
#hoja{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
#hoja .card{width:100%;max-width:560px;max-height:88vh;overflow:auto;margin:0}
@media (min-width:700px){ #hoja{align-items:center} }
.botones{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.botones button{min-width:54px;min-height:48px;font:700 19px/1 var(--display);border-width:1px}
.botones button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#000}
.botones button:disabled{opacity:.35}
.motivo{font-size:12.5px;color:var(--ink-3);margin:-6px 0 10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 14px;border-radius:8px;font-weight:600;max-width:92vw;z-index:30;display:none;border-left:5px solid var(--red)}
#toast.ok{border-left-color:var(--yellow)}
/* Alineación */
.alinea{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:330px}
.alinea label{font-size:12px;font-weight:700;color:var(--ink-2)}
.alinea select{margin-top:2px}
.firma canvas{width:100%;height:150px;border:2px dashed var(--line);border-radius:6px;background:#fff;touch-action:none;display:block}
.firmas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.firmas .f{border:1px solid var(--line);border-radius:8px;padding:8px}
.firmas img{width:100%;height:70px;object-fit:contain;background:#fff;border-radius:4px}
@media (max-width:520px){
  .marcador .pts{font-size:44px} .pista .p{min-height:40px;font-size:18px} .btnPunto{min-height:66px;font-size:22px}
  .acts button{font-size:13px;flex-direction:column;gap:0;line-height:1.15;min-width:0;padding:4px 2px}
  .acts button b{margin:0;font-size:12px}
  .mitad{padding:6px}
}
/* Acta para imprimir (A4 apaisado) */
#impresa{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;color:#000;font-size:9.5px}
  body>*:not(#impresa){display:none!important}
  #impresa{display:block}
}
#impresa h1{font:700 18px/1.1 var(--display);margin:0 0 4px}
#impresa table{border-collapse:collapse;width:100%;margin:0 0 6px}
#impresa td,#impresa th{border:1px solid #000;padding:1.5px 3px;text-align:center;vertical-align:top}
#impresa th{background:#eee}
#impresa .izq{text-align:left}
#impresa .bloque{break-inside:avoid;margin:0 0 6px}
#impresa .pt{display:inline-block;min-width:13px;text-align:center}
#impresa .pt.s{text-decoration:line-through}
#impresa .pt.c{border:1px solid #000;border-radius:50%}
#impresa .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
#impresa table{table-layout:fixed}
#impresa td,#impresa th{overflow-wrap:anywhere}
#impresa img{max-height:34px;max-width:100%}
.vista #impresa{display:block;background:#fff;color:#000;padding:12px;border-radius:8px;font-size:11px;overflow:auto}
</style>
</head>
<body>
<header class="board"><div class="in">
  <a class="back" href="../">← Vòlei EnXarxa</a>
  <h1>Acta electrónica</h1>
  <p class="sub" id="sub">Prototipo · reglas oficiales FIVB 6x6</p>
</div></header>
<main class="wide" id="app"><p class="muted">Cargando…</p></main>
<div id="hoja" class="hidden" role="dialog" aria-modal="true" aria-labelledby="hojaT"><div class="card"><div id="hojaC"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<section id="impresa" aria-label="Acta"></section>
<script src="../config.js"></script>
<script src="../vendor/supabase-2.45.4.js"></script>
<script src="motor.js"></script>
<script src="acta.js"></script>
</body>
</html>

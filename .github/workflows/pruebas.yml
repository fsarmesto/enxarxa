# Pruebas automáticas en cada PR y en cada cambio de main. Solo lee el repo: sin secretos ni permisos de escritura.
# - Funciones de Supabase: tipos (deno check) y pruebas de los avisos (textos en los 2 idiomas, paginación, domingo).
# - Traducciones: docs/i18n-ca.js tiene que estar regenerado con tools/i18n.
# - Web en Chrome sin ventana, con datos inventados: modo sin conexión, calculadora de dietas y accesibilidad.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  funciones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.1.4
      - name: Tipos de las funciones
        run: deno check supabase/functions/*/index.ts
      - name: Pruebas de los avisos
        run: deno test -A supabase/functions/_shared/

  traducciones:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: docs/i18n-ca.js regenerado
        run: |
          python tools/i18n/gen.py tools/i18n docs/i18n-ca.js
          git diff --ignore-cr-at-eol --exit-code docs/i18n-ca.js || { echo "::error::Falta regenerar docs/i18n-ca.js con tools/i18n/gen.py"; exit 1; }

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Calculadora de dietas = cálculo de los cobros
        run: node tools/prueba-calculadora-37.mjs
      - name: Modo sin conexión y cobertura débil
        run: node .github/capturas/prueba-sin-conexion-30.mjs
      - name: Accesibilidad (axe-core, WCAG 2.2 AA) en móvil y escritorio, claro y oscuro
        run: |
          npm i --no-save --no-audit --no-fund axe-core@4.10.2
          node tools/prueba-accesibilidad.mjs
